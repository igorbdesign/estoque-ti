<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS TI - Protótipo Corporativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Cabeçalho Corporativo -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-sm font-bold flex items-center gap-2">🏢 WMS Corporativo TI</h1>
        <p class="text-[10px] text-slate-400">Ambiente Multinacional - M365 Compliance</p>
      </div>
      <div>
        <select id="escritorioGlobal" onchange="mudarEscritorio()" class="bg-slate-800 text-white border border-slate-700 text-xs rounded px-2 py-1 font-bold">
          <option value="SP">Escritório: São Paulo (SP)</option>
          <option value="RJ">Escritório: Rio de Janeiro (RJ)</option>
          <option value="MG">Escritório: Minas Gerais (MG)</option>
          <option value="ES">Escritório: Espírito Santo (ES)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- Abas de Navegação -->
    <div class="grid grid-cols-3 gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm text-xs font-bold text-center">
      <button onclick="mudarAba('entrada')" id="tabEntrada" class="py-2 rounded-lg bg-indigo-600 text-white transition">📥 1. Entradas (NF/SN)</button>
      <button onclick="mudarAba('saida')" id="tabSaida" class="py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition">📤 2. Atribuição (Saída)</button>
      <button onclick="mudarAba('estoque')" id="tabEstoque" class="py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition">📦 3. Saldo & SNs</button>
    </div>

    <!-- ABA 1: ENTRADAS (NF, PO e SNs) -->
    <div id="secaoEntrada" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Entrada de Ativos por Nota Fiscal</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Número da NF</label>
          <input type="text" id="numNf" placeholder="Ex: 45982" class="w-full p-2 border border-slate-300 rounded-lg text-xs" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Número da PO (Opcional)</label>
          <input type="text" id="numPo" placeholder="Ex: PO-88392" class="w-full p-2 border border-slate-300 rounded-lg text-xs" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Modelo do Equipamento</label>
        <select id="modeloEntrada" class="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white">
          <option value="Notebook Latitude 7450">Notebook Latitude 7450</option>
          <option value="Notebook Latitude 7440">Notebook Latitude 7440</option>
          <option value="Dockstation WD25">Dockstation WD25</option>
          <option value="Celular Samsung A36">Celular Samsung A36</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Serial Numbers (SNs) - Um por linha ou separados por vírgula</label>
        <textarea id="listaSns" rows="3" placeholder="SN001, SN002, SN003..." class="w-full p-2 border border-slate-300 rounded-lg text-xs font-mono"></textarea>
        <span class="text-[10px] text-amber-600 font-medium">💡 Se faltarem SNs, o item entra pendente de compliance, mas o sistema permite avançar.</span>
      </div>

      <button onclick="registrarEntrada()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-indigo-700 transition">
        + Registrar Entrada na NF
      </button>
    </div>

    <!-- ABA 2: SAÍDA / ATRIBUIÇÃO (Vínculo ao Colaborador) -->
    <div id="secaoSaida" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atribuição de Ativo (Entrega ao Colaborador)</h2>

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Selecione o Ativo Disponível em Estoque</label>
        <select id="ativoDisponivelSelect" class="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white">
          <option value="">Carregando ativos disponíveis...</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nome do Colaborador</label>
          <input type="text" id="nomeColaborador" placeholder="Ex: Carlos Silva" class="w-full p-2 border border-slate-300 rounded-lg text-xs" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">E-mail Corporativo</label>
          <input type="email" id="emailColaborador" placeholder="carlos.silva@empresa.com" class="w-full p-2 border border-slate-300 rounded-lg text-xs" />
        </div>
      </div>

      <button onclick="registrarSaida()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-emerald-700 transition">
        🔒 Vincular Ativo e Gerar Termo
      </button>
    </div>

    <!-- ABA 3: SALDO DE ESTOQUE E RASTREABILIDADE DE SNs -->
    <div id="secaoEstoque" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Inventário por Serial Number & Custódia</h2>
      
      <div id="tabelaEstoqueContainer" class="space-y-2 text-xs">
        <!-- Renderizado via JS -->
      </div>
    </div>

  </main>

  <script>
    // Estado Global simulando o Banco Relacional (Sharepoint / Firebase)
    let bancoDados = {
      escritorioAtual: "SP",
      ativos: [
        { id: 1, modelo: "Notebook Latitude 7450", sn: "DL-7450-01", status: "Disponivel", colaborador: "-", nf: "45001", escritorio: "SP" },
        { id: 2, modelo: "Notebook Latitude 7450", sn: "DL-7450-02", status: "Em Uso", colaborador: "Ana Souza", nf: "45001", escritorio: "SP" },
        { id: 3, modelo: "Dockstation WD25", sn: "DK-25-99", status: "Disponivel", colaborador: "-", nf: "44900", escritorio: "SP" }
      ]
    };

    function mudarEscritorio() {
      bancoDados.escritorioAtual = document.getElementById('escritorioGlobal').value;
      atualizarInterface();
    }

    function mudarAba(aba) {
      document.getElementById('secaoEntrada').classList.add('hidden');
      document.getElementById('secaoSaida').classList.add('hidden');
      document.getElementById('secaoEstoque').classList.add('hidden');

      document.getElementById('tabEntrada').className = "py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition";
      document.getElementById('tabSaida').className = "py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition";
      document.getElementById('tabEstoque').className = "py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition";

      if (aba === 'entrada') {
        document.getElementById('secaoEntrada').classList.remove('hidden');
        document.getElementById('tabEntrada').className = "py-2 rounded-lg bg-indigo-600 text-white transition";
      } else if (aba === 'saida') {
        document.getElementById('secaoSaida').classList.remove('hidden');
        document.getElementById('tabSaida').className = "py-2 rounded-lg bg-indigo-600 text-white transition";
        atualizarSelectDisponiveis();
      } else if (aba === 'estoque') {
        document.getElementById('secaoEstoque').classList.remove('hidden');
        document.getElementById('tabEstoque').className = "py-2 rounded-lg bg-indigo-600 text-white transition";
        renderizarEstoque();
      }
    }

    function registrarEntrada() {
      const nf = document.getElementById('numNf').value.trim();
      const modelo = document.getElementById('modeloEntrada').value;
      const rawSns = document.getElementById('listaSns').value.trim();

      if (!nf || !rawSns) {
        alert('Preencha o número da NF e pelo menos um Serial Number!');
        return;
      }

      const snsArray = rawSns.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

      snsArray.forEach(sn => {
        // Verifica duplicidade de SN
        const jaExiste = bancoDados.ativos.find(a => a.sn === sn);
        if (!jaExiste) {
          bancoDados.ativos.push({
            id: Date.now() + Math.random(),
            modelo: modelo,
            sn: sn,
            status: "Disponivel",
            colaborador: "-",
            nf: nf,
            escritorio: bancoDados.escritorioAtual
          });
        }
      });

      alert(`✅ Entrada da NF ${nf} registrada com sucesso para ${snsArray.length} ativo(s) em ${bancoDados.escritorioAtual}!`);
      document.getElementById('numNf').value = '';
      document.getElementById('listaSns').value = '';
      mudarAba('estoque');
    }

    function atualizarSelectDisponiveis() {
      const select = document.getElementById('ativoDisponivelSelect');
      select.innerHTML = '';

      const disponiveis = bancoDados.ativos.filter(a => a.escritorio === bancoDados.escritorioAtual && a.status === 'Disponivel');

      if (disponiveis.length === 0) {
        select.innerHTML = '<option value="">Nenhum ativo disponível neste escritório no momento</option>';
        return;
      }

      disponiveis.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.sn;
        opt.textContent = `${item.modelo} (SN: ${item.sn})`;
        select.appendChild(opt);
      });
    }

    function registrarSaida() {
      const snSelecionado = document.getElementById('ativoDisponivelSelect').value;
      const colaborador = document.getElementById('nomeColaborador').value.trim();

      if (!snSelecionado || !colaborador) {
        alert('Selecione um ativo e informe o nome do colaborador!');
        return;
      }

      const ativo = bancoDados.ativos.find(a => a.sn === snSelecionado);
      if (ativo) {
        // Trava de segurança: impede saída se já estiver em uso
        if (ativo.status !== 'Disponivel') {
          alert('⚠️ Erro de Compliance: Este ativo já está atribuído a outro colaborador!');
          return;
        }

        ativo.status = 'Em Uso';
        ativo.colaborador = colaborador;
        alert(`🔒 Ativo ${ativo.sn} vinculado com sucesso a ${colaborador}! Bloqueado contra saídas duplicadas.`);
        document.getElementById('nomeColaborador').value = '';
        document.getElementById('emailColaborador').value = '';
        mudarAba('estoque');
      }
    }

    function renderizarEstoque() {
      const container = document.getElementById('tabelaEstoqueContainer');
      container.innerHTML = '';

      const filtrados = bancoDados.ativos.filter(a => a.escritorio === bancoDados.escritorioAtual);

      if (filtrados.length === 0) {
        container.innerHTML = '<p class="text-slate-400 italic text-center py-4">Nenhum ativo registrado neste escritório.</p>';
        return;
      }

      filtrados.forEach(item => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-200";
        div.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${item.modelo}</span>
            <span class="text-[10px] text-slate-500 block">SN: <b class="text-indigo-600">${item.sn}</b> | NF: ${item.nf}</span>
          </div>
          <div class="text-right">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.status === 'Disponivel' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${item.status}</span>
            <span class="text-[10px] text-slate-600 block mt-0.5">👤 ${item.colaborador}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function atualizarInterface() {
      // Atualiza visualizações se necessário
    }
  </script>
</body>
</html>
